packages:
  - "apps/*"
  - "apps/playground/*"
  - "packages/*"

# pnpm writes these as a placeholder and then refuses the install until they are
# booleans. esbuild links its platform binary here; workerd is what wrangler runs;
# lefthook installs the git hooks from lefthook.yml (it skips itself when CI is set).
allowBuilds:
  core-js: false
  esbuild: true
  lefthook: true
  workerd: true

# One version of everything, declared once. Packages reference these as
# `catalog:` so a component copied out of here can't pick up a stale peer.
catalog:
  react-email: ^6.11.0
  "@better-svelte-email/components": ^2.3.0
  "@better-svelte-email/server": ^2.3.0
  "@docvia/markdown": ^3.0.0
  sonner: ^2.0.8
  svelte-sonner: ^1.2.1
  vaul: ^1.1.2
  swapy: ^1.0.5
  "@tanstack/store": ^0.11.2
  "@tanstack/table-core": ^9.2.4
  "@tanstack/virtual-core": ^3.17.11
  bits-ui: ^2.19.2
  cmdk: ^1.1.1
  # Video player state engine (custom elements; React wrappers under media-chrome/react).
  media-chrome: ^4.19.3
  # HLS for the video player, imported only when a .m3u8 source needs it.
  hls.js: ^1.7.3
  # Form primitives: shadcn pins react-day-picker to v9 (v10 changes the classNames API).
  input-otp: ^1.4.2
  react-day-picker: ^9.14.0
  date-fns: ^4.1.0
  "@internationalized/date": ^3.12.4
  vaul-svelte: ^1.0.0-next.7
  # TypeScript 7 is `latest`, but svelte-check@4 peers on ^5 || ^6 and strict
  # peers are on, so 6 is the newest that installs. Revisit when it widens.
  typescript: ^6.0.3
  "@types/node": ^26.6.2
  zod: ^4.6.5
  # Form state for both ports; framework-agnostic, so no SvelteKit coupling.
  "@tanstack/react-form": ^1.33.5
  "@tanstack/svelte-form": ^1.33.5
  vite: ^8.3.0

  svelte: ^5.57.1
  "@sveltejs/kit": ^3.0.0
  "@sveltejs/vite-plugin-svelte": ^7.3.0
  "@sveltejs/adapter-cloudflare": ^8.0.0
  svelte-check: ^4.7.6

  react: ^19.3.0
  react-dom: ^19.3.0
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.1

  tailwindcss: ^4.3.3
  "@tailwindcss/vite": ^4.3.3
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  tailwind-variants: ^3.3.1

  "@base-ui/react": ^1.8.0
  d3-array: ^3.2.4
  d3-geo: ^3.1.1
  d3-scale: ^4.0.2
  d3-shape: ^3.2.0
  d3-sankey: ^0.12.3
  "@types/d3-array": ^3.2.2
  "@types/d3-geo": ^3.1.1
  "@types/geojson": ^7946.0.16
  world-atlas: ^2.0.2
  topojson-client: ^3.1.0
  "@types/topojson-client": ^3.1.5
  "@types/d3-scale": ^4.0.9
  "@types/d3-shape": ^3.2.0
  "@types/d3-sankey": ^0.12.5
  shiki: ^4.4.3
  "@shikijs/langs": ^4.4.3
  "@shikijs/themes": ^4.4.3
  "@fontsource-variable/inter": ^5.3.0
  "@fontsource-variable/jetbrains-mono": ^5.3.0
  "@fontsource-variable/newsreader": ^5.3.0
  "@iconify-json/solar": ^1.2.13
  simple-icons: ^16.0.0

onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@tailwindcss/oxide"
  - esbuild
  - workerd
