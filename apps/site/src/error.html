<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="robots" content="noindex" />
		<title>%sveltekit.status% · Baby UI</title>
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="preload" href="/fonts/inter-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
		<script>
			// No app CSS or JS here: apply mode-watcher's saved theme before first paint.
			try {
				const mode = localStorage.getItem("mode-watcher-mode");
				const dark = mode === "dark" || (mode !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
				document.documentElement.classList.toggle("dark", dark);
			} catch {}
		</script>
		<style>
			@font-face {
				font-family: "Inter Variable";
				src: url("/fonts/inter-latin-wght.woff2") format("woff2");
				font-weight: 100 900;
				font-display: swap;
			}
			@font-face {
				font-family: "Satoshi";
				src: url("/fonts/satoshi-700.woff2") format("woff2");
				font-weight: 700;
				font-display: swap;
			}

			/* Mirrors packages/tokens/src/tokens.css; this page loads none of the app's CSS. */
			:root {
				color-scheme: light;
				--background: oklch(100% 0 0);
				--foreground: oklch(16% 0.002 265);
				--muted-foreground: oklch(50% 0.004 265);
				--border: oklch(16% 0.002 265 / 0.08);
				--input: var(--border);
				--hover: oklch(15% 0 0 / 0.06);
				--ease-ui-out: cubic-bezier(0.16, 1, 0.3, 1);
			}
			:root.dark {
				color-scheme: dark;
				--background: oklch(17% 0.002 265);
				--foreground: oklch(96% 0.001 265);
				--muted-foreground: oklch(66% 0.004 265);
				--border: oklch(100% 0 0 / 0.07);
				--input: var(--border);
				--hover: rgb(255 255 255 / 0.06);
			}

			* {
				box-sizing: border-box;
			}
			body {
				display: flex;
				min-height: 100dvh;
				flex-direction: column;
				margin: 0;
				background: var(--background);
				color: var(--foreground);
				font-family: "Inter Variable", ui-sans-serif, system-ui, sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			header {
				display: flex;
				height: 3.5rem;
				align-items: center;
				padding: 0 1rem;
			}
			.brand {
				display: inline-flex;
				align-items: center;
				gap: 0.5rem;
				color: var(--foreground);
				font-family: "Satoshi", "Inter Variable", ui-sans-serif, system-ui, sans-serif;
				font-size: 0.9375rem;
				font-weight: 700;
				text-decoration: none;
			}
			.brand svg {
				width: 1.5rem;
				height: 1.5rem;
			}

			main {
				display: flex;
				flex: 1;
				flex-direction: column;
				justify-content: center;
				width: 100%;
				max-width: 64rem;
				margin: 0 auto;
				padding: 4rem 1rem;
			}
			.grid {
				border-top: 1px solid var(--border);
				border-left: 1px solid var(--border);
			}
			.panel {
				position: relative;
				border-right: 1px solid var(--border);
				border-bottom: 1px solid var(--border);
				padding: 2rem 1.25rem;
			}
			.dot {
				position: absolute;
				z-index: 1;
				width: 0.625rem;
				height: 0.625rem;
				border: 1px solid var(--border);
				border-radius: 999px;
				background: var(--background);
				transform: translate(-50%, -50%);
			}

			.badge {
				display: inline-flex;
				height: 1.375rem;
				align-items: center;
				border: 1px solid var(--input);
				border-radius: 999px;
				padding: 0 0.5rem;
				font-size: 0.75rem;
				font-weight: 500;
			}
			.status {
				margin: 1.25rem 0 0;
				font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
				font-size: clamp(4.5rem, 14vw, 6rem);
				font-variant-numeric: tabular-nums;
				font-weight: 600;
				letter-spacing: -0.05em;
				line-height: 1;
			}
			h1 {
				margin: 1.25rem 0 0;
				font-size: 1.5rem;
				font-weight: 600;
				letter-spacing: -0.02em;
			}
			.message {
				max-width: 28rem;
				margin: 0.5rem 0 0;
				color: var(--muted-foreground);
				font-size: 0.875rem;
				line-height: 1.6;
			}

			.actions {
				display: flex;
				flex-wrap: wrap;
				justify-content: center;
				gap: 0.75rem;
				padding: 1.25rem;
			}
			.button {
				display: inline-flex;
				height: 2.25rem;
				align-items: center;
				gap: 0.5rem;
				border: 1px solid transparent;
				border-radius: 0.375rem;
				padding: 0 1rem;
				background: none;
				color: var(--foreground);
				font-family: inherit;
				font-size: 0.875rem;
				font-weight: 500;
				line-height: 1;
				text-decoration: none;
				cursor: pointer;
				transition: background-color 100ms var(--ease-ui-out);
			}
			.button:focus-visible {
				outline: 2px solid var(--foreground);
				outline-offset: 2px;
			}
			.primary {
				background: var(--foreground);
				color: var(--background);
			}
			.outline {
				border-color: var(--input);
				background: var(--background);
			}
			@media (hover: hover) and (pointer: fine) {
				.primary:hover {
					background: color-mix(in oklch, var(--foreground) 90%, transparent);
				}
				.outline:hover,
				.ghost:hover {
					background: var(--hover);
				}
			}
		</style>
	</head>
	<body>
		<header>
			<a class="brand" href="/">
				<svg viewBox="0 0 24 24" aria-hidden="true">
					<path
						fill="currentColor"
						d="M3 3.5A2.5 2.5 0 0 1 8 3.5V16H3ZM8.5 9H15.5A5.5 5.5 0 0 1 21 14.5V17.5A5.5 5.5 0 0 1 15.5 23H8.5A5.5 5.5 0 0 1 3 17.5V14.5A5.5 5.5 0 0 1 8.5 9ZM10.2 14.4A1.6 1.6 0 1 0 10.2 17.6A1.6 1.6 0 1 0 10.2 14.4ZM14.2 14.4A1.6 1.6 0 1 0 14.2 17.6A1.6 1.6 0 1 0 14.2 14.4Z"
					/>
				</svg>
				Baby UI
			</a>
		</header>
		<main>
			<div class="grid">
				<section class="panel">
					<span class="dot" style="top: 0; left: 0" aria-hidden="true"></span>
					<span class="dot" style="top: 0; left: 100%" aria-hidden="true"></span>
					<span class="badge">Error %sveltekit.status%</span>
					<p class="status" aria-hidden="true">%sveltekit.status%</p>
					<h1>Something broke</h1>
					<p class="message">%sveltekit.error.message%</p>
					<p class="message">The app couldn't load. Reloading usually fixes it.</p>
				</section>
				<nav class="panel actions" aria-label="Recovery">
					<span class="dot" style="top: 100%; left: 0" aria-hidden="true"></span>
					<span class="dot" style="top: 100%; left: 100%" aria-hidden="true"></span>
					<button class="button primary" type="button" onclick="location.reload()">Try again</button>
					<a class="button outline" href="/">Back home</a>
					<a class="button outline" href="/components">Browse components</a>
					<a class="button ghost" href="/docs">Read the docs</a>
				</nav>
			</div>
		</main>
	</body>
</html>
