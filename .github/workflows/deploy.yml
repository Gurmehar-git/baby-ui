name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two Cloudflare projects, one build: the site Worker and the registry Pages project
# must never serve JSON from different commits.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  BABY_UI_SITE_URL: https://baby-ui.nexonauts.com
  BABY_UI_REGISTRY_URL: https://baby-ui.pages.dev
  WRANGLER_VERSION: "4.135.0"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # The Pro bundle job needs the private repo token.
    secrets: inherit

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the site dates each component from git for its New/Updated badges.
          fetch-depth: 0
          persist-credentials: false

      # Production always bundles Pro; without the token this fails rather than ship without it.
      # The token reaches this step only and is never written to pro/.git.
      - name: Check out Pro
        uses: actions/checkout@v6
        with:
          # Full history: the site dates each component from git for its New/Updated badges.
          fetch-depth: 0
          repository: kanakkholwal/baby-ui-pro
          token: ${{ secrets.PRO_REPO_TOKEN }}
          # ssh-key: ${{ secrets.PRO_REPO_SSH_KEY }}
          path: pro
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          build-caches: "true"

      - name: Install Pro
        run: pnpm install --frozen-lockfile --dir pro

      # Rebuilt here rather than reused from CI: production URLs and keys are baked in.
      - name: Build site and registry
        run: pnpm build
        env:
          VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          # Pro is bundled but hidden until subscriptions and the account dashboard ship.
          VITE_SHOW_PRO: "false"

      - name: Pro bundled and hidden
        run: node scripts/check-pro-bundle.mjs --expect=hidden

      - name: Worker bundle budget
        run: pnpm size

      - name: Deploy registry to Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: apps/registry
          command: pages deploy --branch=main

      - name: Deploy site Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.WRANGLER_VERSION }}
          workingDirectory: apps/site
          command: deploy

      - name: Smoke-test both origins
        run: |
          set -euo pipefail
          for url in \
            "$BABY_UI_REGISTRY_URL/r/registry.json" \
            "$BABY_UI_REGISTRY_URL/svelte/r/button.json" \
            "$BABY_UI_SITE_URL/" \
            "$BABY_UI_SITE_URL/components/base/button"; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$url")
            echo "$code  $url"
            [ "$code" = "200" ]
          done

      # The flag-off site serves no Pro page and links to none.
      - name: Pro pages stay dark
        run: |
          set -euo pipefail
          for path in /pricing /checkout /dashboard /login; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 "$BABY_UI_SITE_URL$path")
            echo "$code  $path"
            [ "$code" = "404" ]
          done
          if curl -sS "$BABY_UI_SITE_URL/" | grep -q 'href="/pricing"'; then
            echo "The home page links to /pricing"; exit 1
          fi
