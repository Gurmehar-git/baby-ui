name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  # Deploy runs this first, so main gets the same gates without a second copy of them.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gates:
    name: Lint, gates, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # The pre-commit hook fixes these locally; CI only verifies, never writes.
      - name: Lint and format
        run: pnpm exec biome ci .

      - name: Comment gate
        run: node scripts/check-comments.mjs --all

      - name: Import extensions
        run: node scripts/check-import-extensions.mjs

      - name: Tests (scripts, chart core, registry-build)
        timeout-minutes: 5
        env:
          PROBE_BROWSER: /usr/bin/google-chrome
        run: pnpm test

  build:
    name: Type-check, build, bundle budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history: the site dates each component from git for its New/Updated badges.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          build-caches: "true"

      - name: Type-check
        run: pnpm exec turbo run check

      - name: Build
        run: pnpm build

      - name: Worker bundle budget
        run: pnpm size

      # A public checkout has no Pro to show; the pro job below proves the flag with it bundled.
      - name: Pro stays hidden
        run: node scripts/check-pro-bundle.mjs --expect=hidden

      # Built by `pnpm build`; kept so the React preview can be deployed once it has a host.
      - name: Upload React runner build
        uses: actions/upload-artifact@v4
        with:
          name: react-runner
          path: apps/playground/react-runner/dist
          if-no-files-found: error
          retention-days: 14

  # Pro lives in a private repo and is always bundled; the flag only decides whether the site shows it.
  # With its token set, this builds both ways: flag on must show Pro, flag off (production) must not.
  pro:
    name: Pro bundle (VITE_SHOW_PRO=${{ matrix.show-pro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        show-pro: ["true", "false"]
    env:
      HAS_PRO: ${{ secrets.PRO_REPO_TOKEN != '' }}
      # HAS_PRO: ${{ secrets.PRO_REPO_SSH_KEY != '' }}
      VITE_SHOW_PRO: ${{ matrix.show-pro }}
    steps:
      - name: Skip without the Pro token
        if: env.HAS_PRO != 'true'
        run: echo "::notice::PRO_REPO_TOKEN is not set (forks, Dependabot); Pro bundle checks skipped."

      - if: env.HAS_PRO == 'true'
        uses: actions/checkout@v6
        with:
          # Full history: the site dates each component from git for its New/Updated badges.
          fetch-depth: 0
          persist-credentials: false

      # The token reaches this step only: never `env`, never a `run` line, never written to
      # pro/.git, so install scripts and the build cannot read it. GitHub masks it in logs.
      - name: Check out Pro
        if: env.HAS_PRO == 'true'
        uses: actions/checkout@v6
        with:
          # Full history: the site dates each component from git for its New/Updated badges.
          fetch-depth: 0
          repository: kanakkholwal/baby-ui-pro
          token: ${{ secrets.PRO_REPO_TOKEN }}
          # ssh-key: ${{ secrets.PRO_REPO_SSH_KEY }}
          path: pro
          persist-credentials: false

      - if: env.HAS_PRO == 'true'
        uses: ./.github/actions/setup

      - name: Install Pro
        if: env.HAS_PRO == 'true'
        run: pnpm install --frozen-lockfile --dir pro

      - name: Type-check Pro
        if: env.HAS_PRO == 'true'
        run: pnpm --dir pro run check

      - name: Build
        if: env.HAS_PRO == 'true'
        run: pnpm build

      - name: Pro bundled, shown only with the flag on
        if: env.HAS_PRO == 'true'
        run: node scripts/check-pro-bundle.mjs --expect=${{ matrix.show-pro == 'true' && 'visible' || 'hidden' }}
