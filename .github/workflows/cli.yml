name: CLI

on:
  pull_request:
    paths:
      - packages/cli/**
      - packages/create-baby-ui/**
      - pnpm-lock.yaml
      - .github/workflows/cli.yml
  push:
    branches-ignore: [main]
    paths:
      - packages/cli/**
      - packages/create-baby-ui/**
      - pnpm-lock.yaml
      - .github/workflows/cli.yml
  # The release workflow runs this first, so nothing ships that these jobs have not passed.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Path handling is where a CLI breaks, so Windows and macOS run, not just Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @baby-ui/cli... --filter create-baby-ui...

      - name: Type-check and unit tests
        run: pnpm --filter @baby-ui/cli check

      - name: Build
        run: pnpm --filter @baby-ui/cli build

      # Packs both packages, installs the tarballs like a user, and runs real commands offline.
      - name: Tarball smoke test
        run: pnpm --filter @baby-ui/cli smoke

  gates:
    name: Lint and comment gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      # Full install: biome is a root devDependency, which a filtered install leaves out.
      - run: pnpm install --frozen-lockfile
      - name: Biome
        run: pnpm exec biome ci packages/cli packages/create-baby-ui
      - name: Comment gate
        run: node scripts/check-comments.mjs --all
      - name: Import extensions
        run: node scripts/check-import-extensions.mjs
